[tool.poetry]
name = "checkstock"
version = "0.1.0"
description = "Веб-прототип учёта остатков для менеджера маркетплейса"
authors = ["Stepan Obuhov"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
pydantic = "^2.9"
pydantic-settings = "^2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"
pytest-asyncio = "^0.24"
ruff = "^0.17.4"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
